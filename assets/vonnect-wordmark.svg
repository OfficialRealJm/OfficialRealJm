<svg xmlns="http://www.w3.org/2000/svg" width="190" height="76" viewBox="0 0 190 76">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-80" y1="0" x2="-20" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff7ed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-80;220" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;280" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- mini animated flame rising from the V (like the logo) -->
  <g transform="translate(30,2) scale(0.3)">
    <path d="M0,58 C-4,30 8,10 26,-6 C22,10 34,16 44,6 C40,26 58,30 62,46 C68,70 52,92 30,92 C6,92 -6,80 0,58 Z" fill="url(#wg)">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.92;0.94 1.08;1 1" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M-2,-8 C-8,-22 -2,-34 8,-42 C6,-30 18,-28 20,-18 C22,-6 12,2 2,1 C-4,0 -4,-3 -2,-8 Z" fill="#fef3c7" transform="translate(30,62)">
      <animate attributeName="opacity" values="0.95;0.5;0.9;0.7;0.95" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Vonnect — V at onnect na magkadikit (flowing tspan, walang gap) -->
  <text x="10" y="56" fill="url(#wg)"><tspan font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',cursive" font-size="62">V</tspan><tspan font-family="Verdana, DejaVu Sans, sans-serif" font-size="31" font-weight="bold" letter-spacing="1" dy="-1">onnect</tspan></text>

  <!-- shimmer sweep across the whole word -->
  <g fill="url(#shimmer)">
    <text x="10" y="56"><tspan font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',cursive" font-size="62">V</tspan><tspan font-family="Verdana, DejaVu Sans, sans-serif" font-size="31" font-weight="bold" letter-spacing="1" dy="-1">onnect</tspan></text>
  </g>
</svg>
