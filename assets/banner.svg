<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="16" fill="url(#glow)" opacity="0.9"/>

  <!-- twinkling grid dots -->
  <g fill="#f97316">
    <g opacity="0.10">
      <circle cx="60" cy="50" r="2"/><circle cx="160" cy="50" r="2"/><circle cx="260" cy="50" r="2"/>
      <circle cx="110" cy="250" r="2"/><circle cx="210" cy="250" r="2"/>
      <circle cx="740" cy="50" r="2"/><circle cx="840" cy="50" r="2"/><circle cx="940" cy="50" r="2"/>
      <circle cx="790" cy="250" r="2"/><circle cx="890" cy="250" r="2"/>
    </g>
    <g opacity="0.35">
      <circle cx="110" cy="50" r="2">
        <animate attributeName="opacity" values="0.08;0.5;0.08" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="50" r="2">
        <animate attributeName="opacity" values="0.5;0.08;0.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="250" r="2">
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.1s" begin="-1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="250" r="2">
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.5s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="50" r="2">
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.9s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="50" r="2">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="250" r="2">
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="2.7s" begin="-1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="940" cy="250" r="2">
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.3s" begin="-0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- moving sheen sweep -->
  <g transform="skewX(-18)">
    <rect x="-160" y="-40" width="70" height="380" fill="#ffffff" opacity="0.05">
      <animate attributeName="x" values="-160;1150" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== ANIMATED FLAME ==================== -->
  <g transform="translate(150,246)">
    <!-- ambient glow pulse -->
    <ellipse cx="0" cy="-45" rx="90" ry="105" fill="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.7;0.95;0.55" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <animateTransform attributeName="transform" type="skewX" values="0;2.5;-2.5;1.5;0" keyTimes="0;0.3;0.65;0.85;1" dur="2.4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.06 0.94;0.95 1.07;1.04 0.97;1 1" dur="1.7s" repeatCount="indefinite"/>

        <!-- soft halo -->
        <path d="M-30,-34 C-34,-62 -22,-82 -4,-98 C-8,-82 4,-76 14,-86 C10,-66 28,-62 32,-46 C38,-22 22,0 0,0 C-24,0 -36,-12 -30,-34 Z" fill="url(#flame)" filter="url(#soft)" opacity="0.6"/>

        <!-- outer flame -->
        <path d="M-30,-34 C-34,-62 -22,-82 -4,-98 C-8,-82 4,-76 14,-86 C10,-66 28,-62 32,-46 C38,-22 22,0 0,0 C-24,0 -36,-12 -30,-34 Z" fill="url(#flame)">
          <animate attributeName="opacity" values="1;0.9;1" dur="0.9s" repeatCount="indefinite"/>
        </path>

        <!-- mid flame -->
        <path d="M-18,-20 C-22,-45 -10,-62 4,-76 C0,-60 12,-55 18,-64 C15,-45 26,-40 28,-26 C31,-10 16,1 0,0 C-14,-1 -16,-8 -18,-20 Z" fill="#fb923c" opacity="0.95">
          <animateTransform attributeName="transform" type="scale" values="1 1;0.92 1.08;1.05 0.95;1 1" dur="1.1s" repeatCount="indefinite"/>
        </path>

        <!-- white-hot core -->
        <path d="M-2,-8 C-8,-22 -2,-34 8,-42 C6,-30 18,-28 20,-18 C22,-6 12,2 2,1 C-4,0 -4,-3 -2,-8 Z" fill="#fff7ed">
          <animate attributeName="opacity" values="0.95;0.55;0.9;0.7;0.95" dur="0.7s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- rising embers -->
    <g fill="#fdba74">
      <circle cx="0" cy="0" r="3">
        <animateMotion path="M8,-20 C16,-60 -6,-95 6,-150" dur="2.6s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.95;0.8;0" keyTimes="0;0.12;0.6;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2">
        <animateMotion path="M-6,-15 C-14,-55 6,-90 -4,-140" dur="3.1s" begin="-1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.7;0" keyTimes="0;0.12;0.6;1" dur="3.1s" begin="-1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2.5">
        <animateMotion path="M2,-25 C12,-70 -10,-110 2,-165" dur="2.2s" begin="-0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.75;0" keyTimes="0;0.12;0.6;1" dur="2.2s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="1.8">
        <animateMotion path="M14,-18 C22,-50 4,-85 12,-125" dur="2.9s" begin="-1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0.65;0" keyTimes="0;0.12;0.6;1" dur="2.9s" begin="-1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2.2">
        <animateMotion path="M-12,-22 C-20,-60 -2,-100 -10,-145" dur="2.4s" begin="-1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0.7;0" keyTimes="0;0.12;0.6;1" dur="2.4s" begin="-1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ==================== NAME (solid orange) ==================== -->
  <g font-family="Verdana, DejaVu Sans, sans-serif" font-size="58" font-weight="bold" letter-spacing="1">
    <text x="220" y="150" fill="#f97316" filter="url(#soft)" opacity="0.65">
      OfficialRealJm
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="150" fill="url(#textGrad)">OfficialRealJm</text>
  </g>

  <!-- divider -->
  <rect x="222" y="176" width="560" height="2" fill="url(#line)"/>

  <!-- subtitle -->
  <text x="222" y="212" font-family="Verdana, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#fdba74" letter-spacing="1.5">APP DEVELOPER • OWNER/FOUNDER OF VONNECT</text>
  <text x="222" y="242" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#8b949e" letter-spacing="1">mobile apps • social platforms 🇵🇭</text>
</svg>
